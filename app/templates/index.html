<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversor de RTF para HTML</title>
<style>
  body{font-family:Calibri,Arial,sans-serif;background:#f4f6f4;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .card{background:#fff;padding:32px 40px;border-radius:10px;box-shadow:0 4px 18px #0001;width:min(520px,92vw);text-align:center}
  h1{color:#477f55;font-size:20px;display:flex;align-items:center;justify-content:center;gap:12px}
  h1 img{width:56px}
  label{display:block;margin:14px 0;text-align:left}
  input[type=text]{width:100%;padding:6px;box-sizing:border-box}
  button{background:#477f55;color:#fff;border:0;padding:10px 22px;border-radius:6px;font-size:15px;cursor:pointer}
  footer{margin-top:24px;font-size:12px;color:#666}
  #msg{margin-top:12px;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h1><img src="/static/brasao.png" alt="">CONVERSOR DE RTF PARA HTML</h1>
  <form id="f">
    <label>Arquivos RTF<br><input type="file" name="files" accept=".rtf" multiple required></label>
    <label>Organização Militar<br><input type="text" name="om" value="DIRETORIA DE HIDROGRAFIA E NAVEGAÇÃO"></label>
    <label><input type="checkbox" name="revogado" value="true"> Portaria revogada (texto riscado)</label>
    <button>Converter</button>
  </form>
  <div id="msg"></div>
  <footer>Desenvolvido por CHM-53.1<br><i>© Propriedade Intelectual DHN - Versão 1.0.0</i></footer>
</div>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = 'Convertendo...';
  const r = await fetch('/api/convert', {method:'POST', body:new FormData(e.target)});
  if (!r.ok) { msg.textContent = 'Erro: ' + (await r.json()).detail; return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(await r.blob());
  a.download = 'portarias_html.zip'; a.click();
  msg.textContent = e.target.files.files.length + ' arquivo(s) convertido(s) para HTML.';
};
</script>
</body>
</html>
